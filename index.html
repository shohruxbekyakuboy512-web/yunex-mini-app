<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yunex</title>
  <style>
    body{
      margin:0;background:#03100a;color:white;
      font-family:Arial;text-align:center;
    }
    h1{margin-top:40px;color:#2bff6b}
    #coin{
      width:180px;height:180px;border-radius:50%;
      margin:70px auto 30px;
      background:#092719;
      border:5px solid #f5b942;
      display:flex;align-items:center;justify-content:center;
      font-size:70px;font-weight:bold;
      box-shadow:0 0 35px #2bff6b;
      cursor:pointer;
    }
    #coin:active{transform:scale(.93)}
    .energy{color:#f5b942}
  </style>
</head>
<body>

<h1>YUNEX</h1>

<div>Balance: <b id="balance">0</b> YNX</div>

<div id="coin">Y</div>

<div class="energy">
  ⚡ Energy: <span id="energy">100</span>/100
</div>

<script>
let balance=0;
let energy=100;

document.getElementById("coin").onclick=()=>{
  if(energy<=0)return;
  balance++;
  energy--;
  document.getElementById("balance").textContent=balance;
  document.getElementById("energy").textContent=energy;
};

setInterval(()=>{
  if(energy<100){
    energy++;
    document.getElementById("energy").textContent=energy;
  }
},1000);
</script>

</body>
</html>
